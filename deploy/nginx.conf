# Include inside the nginx http {} block. Provide certificates before deployment.
# Only the generic mapping knows about ~; local directories never contain it.
map $uri $pages_path {
    default "";
    "~^/~([a-z0-9][a-z0-9._-]{0,62})(/.*)?$" /$1$2;
}
server {
    listen 443 ssl;
    server_name hoshilet-admin.example.com;
    ssl_certificate /etc/ssl/pages-admin/fullchain.pem;
    ssl_certificate_key /etc/ssl/pages-admin/privkey.pem;
    root /srv/hoshilet/admin;
    index index.html;
    autoindex off;
    client_max_body_size 128m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    proxy_read_timeout 720s;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    location ~ ^/(api|auth)(/|$) {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
server {
    listen 443 ssl;
    server_name hoshilet.example.com;
    ssl_certificate /etc/ssl/pages/fullchain.pem;
    ssl_certificate_key /etc/ssl/pages/privkey.pem;
    root /var/lib/hoshilet/public;
    autoindex off;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
    # Separate directory and file requests to preserve the external URL on redirects.
    location ~ /$ {
        if ($pages_path = "") { return 404; }
        rewrite ^ $pages_path break;
        try_files $uri/index.html =404;
    }
    location / {
        if ($pages_path = "") { return 404; }
        if (-d $document_root$pages_path) { return 308 $uri/$is_args$args; }
        rewrite ^ $pages_path break;
        try_files $uri =404;
    }
}
